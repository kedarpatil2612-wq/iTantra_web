<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTantra | Offline Communication</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #123b52 0%, #07121c 45%, #03070b 100%);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 45px 28px;
      border: 1px solid rgba(0, 220, 255, 0.25);
      border-radius: 28px;
      background: rgba(7, 18, 28, 0.82);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 50px rgba(0, 200, 255, 0.12);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(135deg, #00d9ff, #0066ff);
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.35);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .tagline {
      color: #a9c7d8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 14px 0;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: 0.25s;
    }

    .web {
      color: white;
      background: linear-gradient(90deg, #0077ff, #00bfff);
    }

    .youtube {
      color: white;
      background: linear-gradient(90deg, #e60000, #ff3030);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 200, 255, 0.22);
    }

    .info {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #78909c;
      font-size: 13px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 22px;
      color: #4e6875;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">iT</div>

    <h1>iTantra</h1>

    <p class="tagline">
      Offline Phone-to-Phone Communication<br>
      Connect • Communicate • Anywhere
    </p>

    <a
      class="btn web"
      href="https://akyaanarvekar.github.io/iTantra_website/"
      target="_blank"
    >
      🌐 Open iTantra Web Demo
    </a>

    <a
      class="btn youtube"
      href="https://youtube.com/@itantra?si=quilxZh0alz0CNnU"
      target="_blank"
    >
      ▶️ Watch iTantra Demo
    </a>

    <div class="info">
      AI-powered offline communication using<br>
      local device-to-device connectivity.
    </div>

    <div class="footer">
      iTantra • Innovation for Connected Communities
    </div>

  </div>

</body>
</html>
